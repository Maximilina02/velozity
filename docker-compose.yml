version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: velocity_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: velocity
    ports:
      - '5432:5432'
    volumes:
      - velocity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d velocity']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: velocity_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgrespassword123@postgres:5432/velocity?schema=public
      JWT_ACCESS_SECRET: velocity_super_secret_access_key_998124
      JWT_REFRESH_SECRET: velocity_super_secret_refresh_key_384721
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY_DAYS: 7
    ports:
      - '5000:5000'

volumes:
  velocity_pgdata:
